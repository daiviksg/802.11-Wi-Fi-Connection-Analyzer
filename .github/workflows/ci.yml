name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Fetch public captures
        run: python tests/data/public/fetch.py
      - name: Test (C parser and tshark tests skip here)
        run: pytest -v
      - name: Smoke-test the CLI on a public capture
        run: |
          wifi-analyzer frames tests/data/public/wpa-Induction.pcap --limit 5
          wifi-analyzer analyze tests/data/public/wpa-Induction.pcap

  c-parser-and-validation:
    runs-on: ubuntu-latest
    env:
      # Any sanitizer finding aborts wifiparse with a non-zero exit code, failing the test.
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Install libpcap, tshark, valgrind
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libpcap-dev tshark valgrind
          tshark --version | head -1
      - name: Build (optimized, and ASan + UBSan)
        run: |
          make -C c
          make -C c debug
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Fetch public captures
        run: python tests/data/public/fetch.py
      - name: All tests with the sanitizer build (C vs Python vs tshark, fuzzing)
        run: |
          mkdir -p reports
          WIFIPARSE=c/wifiparse-debug pytest -v -rs --junitxml=reports/junit.xml
      - name: C parser tests with the optimized build
        run: WIFIPARSE=c/wifiparse pytest -v tests/test_c_parser.py tests/test_compare.py
      - name: Valgrind (leaks and invalid reads)
        run: |
          for f in tests/data/public/*.pcap tests/data/synthetic/*.pcap; do
            valgrind --quiet --leak-check=full --errors-for-leak-kinds=all --error-exitcode=1 c/wifiparse "$f" > /dev/null
          done
      - name: Agreement report (Python vs C vs tshark)
        run: |
          for f in tests/data/public/*.pcap tests/data/synthetic/*.pcap; do
            wifi-analyzer compare "$f" | tee -a reports/compare.txt
            wifi-analyzer compare --format json "$f" > "reports/$(basename "$f" .pcap).json"
          done
      - name: Summary (job summary + public annotations)
        if: always()
        run: python scripts/ci_summary.py reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare-report
          path: reports/
