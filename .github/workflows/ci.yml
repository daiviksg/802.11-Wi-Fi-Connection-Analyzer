name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Fetch public captures
        run: python tests/data/public/fetch.py
      - name: Test
        run: pytest -v
      - name: Smoke-test the CLI on a public capture
        run: wifi-analyzer frames tests/data/public/wpa-Induction.pcap --limit 5

  # Milestone 3 adds a C job here: build (normal + ASan/UBSan) and test c/wifiparse.
  # Milestone 4 adds tshark and the C-vs-Python-vs-tshark comparison.
